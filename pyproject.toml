[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musiq"
authors = [
    { name = "Sonja Adomeit", email = "sonja.adomeit@med.uni-augsburg.de" },
    { name = "Lukas Förner", email = "lukas.foerner@med.uni-augsburg.de"},
    { name = "Clinical Computational Medical Imaging Research, University Hospital Augsburg, Germany" }
]
description = "MUSIQ - Multimodal Unified Segmentation & Image Quantification. A Python package for radiomics feature extraction from medical images, specifically PET/CT and MRI scans."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: Development Status :: 0",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Imaging",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]
keywords = [
    "deep learning",
    "image segmentation",
    "semantic segmentation",
    "medical image analysis",
    "medical image segmentation",
    "nnU-Net",
    "nnunet",
    "total segmentator",
    "radiomics",
]
dependencies= [
    "acvl_utils==0.2.5",
    "batchgenerators==0.25.1",
    "batchgeneratorsv2==0.3.0",
    "blosc2==3.4.0",
    "certifi==2025.6.15",
    "cfgv==3.4.0",
    "charset-normalizer==3.4.2",
    "colorama==0.4.6",
    "connected-components-3d==3.24.0",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "dicom2nifti==2.6.2",
    "dcm2niix==1.0.20250506",
    "distlib==0.3.9",
    "dynamic_network_architectures==0.3.1",
    "einops==0.8.1",
    "fft-conv-pytorch==1.2.0",
    "filelock==3.18.0",
    "fonttools==4.58.4",
    "fsspec==2025.5.1",
    "future==1.0.0",
    "graphviz==0.21",
    "huggingface-hub==0.33.0",
    "identify==2.6.12",
    "idna==3.10",
    "imagecodecs==2025.3.30",
    "imageio==2.37.0",
    "Jinja2==3.1.6",
    "joblib==1.5.1",
    "kiwisolver==1.4.8",
    "lazy_loader==0.4",
    "linecache2==1.0.0",
    "lxml==5.4.0",
    "MarkupSafe==3.0.2",
    "matplotlib==3.10.3",
    "mpmath==1.3.0",
    "msgpack==1.1.1",
    "ndindex==1.10.0",
    "networkx==3.5",
    "nibabel==5.3.2",
    "nilearn==0.12.0",
    "nodeenv==1.9.1",
    "numexpr==2.11.0",
    "numpy==1.26.4",
    "packaging==25.0",
    "pandas==2.3.0",
    "pillow==11.2.1",
    "platformdirs==4.3.8",
    "pre-commit==4.2.0",
    "py-cpuinfo==9.0.0",
    "pyarrow==20.0.0",
    "pydicom==3.0.1",
    "pyparsing==3.2.3",
    "pytest==9.0.2",
    "python-dateutil==2.9.0.post0",
    "python-gdcm==3.0.25",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "requests==2.32.4",
    "safetensors==0.5.3",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.0",
    "scipy==1.16.0",
    "seaborn==0.13.2",
    "setuptools==80.9.0",
    "simpleitk==2.5.2",
    "six==1.17.0",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tifffile==2025.6.11",
    "timm==1.0.15",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "TotalSegmentator==2.9.0",
    "tqdm==4.67.1",
    "traceback2==1.4.0",
    "typing_extensions==4.14.0",
    "tzdata==2025.2",
    "unittest2==1.1.0",
    "urllib3==2.5.0",
    "virtualenv==20.31.2",
    "xmltodict==0.14.2",
    "xvfbwrapper==0.2.13",
    "yacs==0.1.8",
]

[project.scripts]
musiq_autopet_inference = "musiq.autopet_inference:autopet_inference_entrypoint"
musiq_export_validation = "musiq.export_validation:export_validation_entrypoint"
musiq_patient_info_extraction = "musiq.patient_info_extraction:patient_info_extraction_entrypoint"
musiq_plot_summary = "musiq.plot_summary:plot_summary_entrypoint"
musiq_extraction = "musiq.radiomics_extraction:radiomics_extraction_entrypoint"
musiq_series_selection = "musiq.series_selection:series_selection_entrypoint"
musiq_summary_generation = "musiq.summary_generation:summary_generation_entrypoint"
musiq_totalsegmentator_inference = "musiq.totalsegmentator_inference:totalsegmentator_inference_entrypoint"
musiq_tumor_info_extraction = "musiq.tumor_info_extraction:tumor_info_extraction_entrypoint"
musiq = "musiq.workflow:workflow_entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
homepage = "https://TBA.com"
repository = "https://TBA.com"

[project.optional-dependencies]
testing = ["setuptools", "pytest", "pytest-cov"]
pre-commit = ["pre-commit", "ruff", "black"]

[tool.pytest.ini_options]
addopts = "--cov musiq --cov-report term-missing --verbose"
testpaths = ["test"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.isort]
known-first-party = ["musiq"]

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.black]
line-length = 120
extend-exclude = ".venv .eggs venv"
