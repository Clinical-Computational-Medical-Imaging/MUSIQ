# =============================================================================
# MUSIQ – Test workflow (GitHub Actions)
# =============================================================================
#
# Runs the two test suites in test/:
#
#   unit         fast, self-contained tests (test/unit); no real patient data
#   integration  slow end-to-end tests (test/integration) using the real
#                dcm2niix binary and real DICOM series from TCIA
#
# Execution order: the integration job starts only after the unit tests have
# passed. If the unit tests fail, the data download and the heavy dependency
# installation are skipped.
#
# The following settings are not defined here but in pyproject.toml
# ([tool.pytest.ini_options]) and apply to every pytest invocation:
#   - testpaths = ["test"]
#   - Coverage: --cov musiq --cov-report term-missing
#   - filterwarnings = ["error"]  -> any warning causes the test to fail
#
# To reproduce locally:
#   pytest test/unit -rs
#   pytest test/integration --download-integration-data -rs
# =============================================================================

name: Tests

# -----------------------------------------------------------------------------
# Triggers
# -----------------------------------------------------------------------------
# Without filters, push and pull_request apply to all branches (push also
# applies to tags). The version of this file from the triggering commit or
# pull request is always used.
on:
  push:
  pull_request:
  # Manual trigger via "Run workflow" in the Actions tab. The button is only
  # shown once this file exists on the default branch.
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Job 1: Unit tests
  # ===========================================================================
  unit:
    name: Unit tests
    # Fresh GitHub-hosted Ubuntu VM; discarded after the job finishes.
    runs-on: ubuntu-latest
    steps:
      # Check out the repository at the triggering commit.
      - uses: actions/checkout@v4

      # External repository that must be present in the project directory
      # before "pip install -r requirements.txt" (equivalent to the git clone
      # step in the README).
      # Without a ref, the latest revision is always fetched, so upstream
      # changes may break runs without any change in this repository. To pin
      # it, add "ref: <commit SHA or tag>".
      - uses: actions/checkout@v4
        with:
          repository: mic-dkfz/autopet-3-submission
          path: autopet-3-submission

      # CADS repository, imported at runtime via sys.path from the project
      # directory (equivalent to "git clone https://github.com/murong-xu/CADS.git").
      - uses: actions/checkout@v4
        with:
          repository: murong-xu/CADS
          path: CADS

      # Install Python and persist the pip download cache between runs.
      # The cache is invalidated whenever requirements.txt or this file changes
      # (this file pins the torch and TPTBox versions).
      # The version is quoted because YAML would otherwise parse e.g. 3.10 as 3.1.
      # 3.12 matches the version tested in the README.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/tests.yml

      # requirements.txt installs the project itself, which includes the
      # dcm2niix PyPI package providing the dcm2niix command-line binary.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install torch/torchvision before requirements.txt because they are
          # not pinned there. This job does not require a GPU, so the CPU wheels
          # are used: same version, but only a fraction of the download size.
          # A "torch==2.8.0" requirement in other packages is also satisfied
          # by "2.8.0+cpu".
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # The "testing" extra from pyproject.toml provides pytest and
          # pytest-cov. pytest-cov is required because pyproject.toml sets
          # --cov; without the plugin, pytest aborts immediately.
          pip install -e ".[testing]"
          # --no-deps as in the README, so these packages do not overwrite
          # already installed versions (e.g. torch).
          pip install TPTBox==0.3.0 fastremap fill_voids --no-deps

      # Guard against false-positive runs: tests that require dcm2niix skip
      # themselves if the binary is missing (dcm2niix_available fixture).
      # This step makes the job fail instead.
      - name: Check dcm2niix is on PATH
        run: command -v dcm2niix

      # -rs: list all skipped tests with their reason at the end of the run.
      - name: Run unit tests
        run: pytest test/unit -rs

  # ===========================================================================
  # Job 2: Integration tests
  # ===========================================================================
  # On every run, the required series are downloaded via the public TCIA REST
  # API into a temporary directory that is deleted at the end of the session.
  # This costs time and Actions minutes and puts load on the TCIA servers.
  # When using the data, follow the citation requirements in the README.
  #
  # The alternative --integration-data-dir (locally downloaded data) only
  # works on a self-hosted runner where the data is available.
  integration:
    name: Integration tests
    # Start only after the "unit" job has succeeded.
    # Remove this line to run both jobs in parallel.
    needs: unit
    runs-on: ubuntu-latest
    # Abort the job after 30 minutes, e.g. if the download hangs
    # (the default is 6 hours).
    timeout-minutes: 30
    steps:
      # Each job runs on its own VM, so the setup is identical to the unit
      # job (see the comments there).
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: mic-dkfz/autopet-3-submission
          path: autopet-3-submission

      - uses: actions/checkout@v4
        with:
          repository: murong-xu/CADS
          path: CADS

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/tests.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e ".[testing]"
          pip install TPTBox==0.3.0 fastremap fill_voids --no-deps

      # All integration tests require dcm2niix; without this check they
      # would be skipped silently.
      - name: Check dcm2niix is on PATH
        run: command -v dcm2niix

      # --download-integration-data enables the automatic TCIA download.
      # Without this option, the integration tests skip themselves.
      - name: Run integration tests (downloads TCIA data)
        run: pytest test/integration --download-integration-data -rs
